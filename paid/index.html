<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment received — Diaspora to Home</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
  :root{ --navy:#231B4F; --purple:#7170B4; --beige:#F5F1ED; --muted:#6B6880; --line:#E7E3DD; --green:#2E7D55; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Montserrat',Arial,sans-serif; color:var(--navy);
        background:var(--beige); display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:8px; max-width:520px; width:100%;
         padding:40px 34px; text-align:center; box-shadow:0 10px 40px rgba(35,27,79,.08); }
  .tick{ width:64px; height:64px; border-radius:50%; background:#E7F2EC; margin:0 auto 22px;
         display:flex; align-items:center; justify-content:center; }
  .tick svg{ width:32px; height:32px; }
  h1{ font-size:24px; font-weight:800; margin:0 0 12px; }
  p{ font-size:15px; line-height:1.6; color:var(--muted); margin:0 0 14px; }
  .prop{ font-weight:700; color:var(--navy); }
  .steps{ text-align:left; background:var(--beige); border-radius:6px; padding:16px 18px; margin:22px 0 8px; }
  .steps h2{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--purple); margin:0 0 10px; }
  .steps ol{ margin:0; padding-left:18px; }
  .steps li{ font-size:14px; line-height:1.55; color:var(--navy); margin:6px 0; }
  .home{ display:inline-block; margin-top:18px; font-size:14px; font-weight:600; color:#fff;
         background:var(--navy); text-decoration:none; padding:12px 22px; border-radius:4px; }
  .note{ font-size:12px; color:var(--muted); margin-top:16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2E7D55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Payment received</h1>
    <p id="lead">Thank you — your listing fee has been received.</p>

    <div class="steps">
      <h2>What happens next</h2>
      <ol>
        <li>Our team reviews and verifies your property details.</li>
        <li>Once approved, your listing goes live on Diaspora to Home.</li>
        <li>Buyer enquiries come straight to you through our team.</li>
      </ol>
    </div>

    <a class="home" href="https://diasporatohome.com">Return to Diaspora to Home</a>
    <p class="note" id="note"></p>
  </div>

<script>
(function(){
  var SUPABASE_URL = "https://kxrhzijqyotyrzhpiflv.supabase.co";
  var SUPABASE_KEY = "sb_publishable_sbrP5QdcQ9APlxHx2UagDA_77j3yefb";

  function qp(name){
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  function ls(name){
    try { return (window.localStorage) ? (localStorage.getItem(name) || "") : ""; } catch(e){ return ""; }
  }
  function clearLs(){
    try { if(window.localStorage){ localStorage.removeItem("dth_pay_email"); localStorage.removeItem("dth_pay_sid"); } } catch(e){}
  }

  // Identity: submission id (?sid) preferred, else payer email (?e or e=),
  // else same-origin fallback stored by the seller form.
  var sid   = qp("sid") || ls("dth_pay_sid");
  var email = qp("e") || qp("email") || ls("dth_pay_email");

  var note = document.getElementById("note");

  if(!sid && !email){
    note.textContent = "If your listing doesn't show as paid shortly, our team will confirm it manually.";
    return;
  }

  fetch(SUPABASE_URL + "/rest/v1/rpc/confirm_payment", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_sid: sid || null, p_email: email || null })
  })
  .then(function(res){ return res.json(); })
  .then(function(out){
    if(out && out.matched){
      if(out.property_title){
        document.getElementById("lead").innerHTML =
          'Thank you — your listing fee for <span class="prop">' +
          String(out.property_title).replace(/[<>&]/g, "") +
          '</span> has been received.';
      }
      clearLs();
    } else {
      note.textContent = "If your listing doesn't show as paid shortly, our team will confirm it manually.";
    }
  })
  .catch(function(){
    note.textContent = "If your listing doesn't show as paid shortly, our team will confirm it manually.";
  });
})();
</script>
</body>
</html>
