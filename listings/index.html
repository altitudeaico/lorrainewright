<!-- ============================================================
     Diaspora to Home — Property Listings (LIVE, GHL embed)
     Self-contained block: paste into a GHL "Custom HTML / Code" element.
     Reads published listings live from Supabase. ES5-only. All CSS is
     scoped under #d2h-props so it cannot clash with the GHL template.
     Font loaded via @import (GHL strips <link> tags).
     ============================================================ -->
<div id="d2h-props">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
    #d2h-props{
      --navy:#231B4F; --purple:#7170B4; --beige:#F5F1ED;
      --ink:#231B4F; --muted:#6B6880; --line:#E7E3DD; --white:#fff;
      font-family:'Montserrat',Arial,sans-serif; color:var(--ink);
      max-width:1200px; margin:0 auto; padding:24px 20px 48px;
      -webkit-font-smoothing:antialiased;
    }
    #d2h-props *{box-sizing:border-box;}

    /* ---------- shared ---------- */
    .d2h-eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase;
      color:var(--purple); font-weight:700; margin:0 0 6px;}
    .d2h-h2{font-size:34px; line-height:1.1; font-weight:800; margin:0 0 28px; color:var(--navy);}
    .d2h-badge{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em;
      text-transform:uppercase; padding:7px 12px; border-radius:6px;}
    .d2h-badge--offplan{background:var(--purple); color:#fff;}
    .d2h-badge--status{background:rgba(35,27,79,.82); color:#fff; backdrop-filter:blur(2px);}
    .d2h-badge--type{font-size:10px; padding:5px 10px; border-radius:20px;}
    .d2h-badge--vetted{background:#0E7C5A; color:#fff;}
    .d2h-badge--seller{background:#EFEAFF; color:var(--purple); border:1px solid #DAD2FB;}
    .d2h-badge--forsale{background:#231B4F; color:#fff;}
    .d2h-badge--forrent{background:#C9A961; color:#231B4F;}
    .d2h-toolbar{background:#fff; border:1px solid #E7E3DD; border-radius:14px; padding:16px 18px; margin:0 0 24px;}
    .d2h-tbrow{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
    .d2h-tbrow + .d2h-tbrow{margin-top:12px;}
    .d2h-tbinput{border:1px solid #E7E3DD; border-radius:10px; padding:10px 12px; font-family:inherit;
      font-size:14px; color:var(--navy,#231B4F); background:#fff; width:100%; box-sizing:border-box;}
    .d2h-tbinput:focus{outline:none; border-color:var(--purple,#7170B4);}
    .d2h-tbsearch{flex:1 1 260px;}
    .d2h-tbfield{display:flex; flex-direction:column; gap:5px; flex:1 1 120px; min-width:110px;}
    .d2h-tbfield span{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#6B6880;}
    .d2h-seg{display:inline-flex; border:1px solid #E7E3DD; border-radius:22px; overflow:hidden; flex:0 0 auto; height:42px;}
    .d2h-segbtn{border:0; background:#fff; color:var(--navy,#231B4F); font-weight:600; font-size:14px; padding:0 18px; cursor:pointer;}
    .d2h-segbtn + .d2h-segbtn{border-left:1px solid #E7E3DD;}
    .d2h-segbtn.is-active{background:var(--navy,#231B4F); color:#fff;}
    .d2h-tbclear{border:1px solid #E7E3DD; background:#F5F1ED; color:var(--navy,#231B4F); font-weight:600;
      font-size:14px; padding:10px 16px; border-radius:10px; cursor:pointer; flex:0 0 auto; height:42px;}
    .d2h-tbclear:hover{border-color:var(--purple,#7170B4);}
    .d2h-tbcount{margin-top:12px; font-size:13px; color:#6B6880; font-weight:600;}

    .d2h-specs{display:flex; gap:16px; align-items:center; color:var(--muted); font-weight:600; font-size:14px;}
    .d2h-specs span{display:inline-flex; align-items:center; gap:6px;}
    .d2h-specs svg{width:18px; height:18px; flex:none; opacity:.7;}

    /* ---------- grid ---------- */
    .d2h-grid{display:grid; grid-template-columns:1fr 1fr; gap:26px;}
    .d2h-card{background:var(--white); border:1px solid var(--line); border-radius:14px;
      overflow:hidden; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease;
      box-shadow:0 1px 2px rgba(35,27,79,.04);}
    .d2h-card:hover{transform:translateY(-4px); box-shadow:0 14px 30px rgba(35,27,79,.14);}
    .d2h-card__media{position:relative; height:280px;
      background:linear-gradient(135deg,#cdd6e4 0%,#9aa6bd 100%);}
    .d2h-card__media img{width:100%; height:100%; object-fit:cover; display:block;}
    .d2h-imgph{display:flex !important; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#2E2566 0%,#231B4F 100%);}
    .d2h-ph{color:rgba(255,255,255,.85); font-size:13px; font-weight:600; letter-spacing:.03em;
      text-align:center; padding:0 16px; line-height:1.4;}
    .d2h-ph small{display:block; font-size:10px; font-weight:600; opacity:.6; margin-top:5px;
      letter-spacing:.16em; text-transform:uppercase;}
    .d2h-card__media .d2h-badge--offplan{position:absolute; top:16px; left:16px;}
    .d2h-card__media .d2h-badge--status{position:absolute; top:16px; right:16px;}
    .d2h-ribbon{position:absolute; top:16px; left:16px; z-index:2; background:#c9a961; color:#231B4F;
      font-weight:700; font-size:12px; padding:6px 12px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,.18);}
    .d2h-card--featured{border-color:#c9a961; box-shadow:0 0 0 2px rgba(201,169,97,.35);}
    .d2h-card--featured .d2h-badge--offplan{top:52px;}
    .d2h-price{position:absolute; left:16px; bottom:16px; background:#fff; color:var(--navy);
      font-weight:800; font-size:20px; padding:9px 16px; border-radius:10px;
      box-shadow:0 4px 12px rgba(0,0,0,.18);}
    .d2h-card__body{padding:18px 20px 20px; display:flex; justify-content:space-between;
      align-items:flex-start; gap:14px;}
    .d2h-card__title{font-size:20px; font-weight:700; margin:0 0 4px; color:var(--navy);}
    .d2h-card__loc{margin:0; color:var(--muted); font-size:14px; font-weight:500;}
    .d2h-card__meta{display:flex; flex-direction:column; align-items:flex-end; gap:10px; flex:none;}

    /* ---------- detail ---------- */
    .d2h-detail{display:none;}
    .d2h-back{display:inline-flex; align-items:center; gap:8px; background:none; border:none;
      cursor:pointer; font-family:inherit; font-weight:700; font-size:14px; color:var(--purple);
      padding:0; margin:0 0 22px;}
    .d2h-back svg{width:18px; height:18px;}
    .d2h-back:hover{color:var(--navy);}
    .d2h-detail__top{display:grid; grid-template-columns:1.05fr .95fr; gap:32px; align-items:start;}
    .d2h-gallery{border-radius:16px; overflow:hidden;
      background:linear-gradient(135deg,#cdd6e4 0%,#9aa6bd 100%); aspect-ratio:4/3;}
    .d2h-gallery img{width:100%; height:100%; object-fit:cover; display:block;}
    .d2h-thumbs{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
    .d2h-thumb{width:76px; height:60px; object-fit:cover; border-radius:8px; cursor:pointer;
      border:2px solid transparent; opacity:.7; transition:opacity .15s ease, border-color .15s ease;}
    .d2h-thumb:hover{opacity:1;}
    .d2h-thumb.is-active{opacity:1; border-color:#C9A961;}
    .d2h-panel__head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
    .d2h-panel__title{font-size:26px; font-weight:800; margin:0; color:var(--navy);}
    .d2h-panel__price{font-size:38px; font-weight:800; color:var(--navy); margin:14px 0 2px;}
    .d2h-panel__loc{color:var(--muted); font-weight:600; margin:0 0 14px;}
    .d2h-tagrow{display:flex; gap:10px; align-items:center; margin:0 0 20px; flex-wrap:wrap;}
    .d2h-cta{display:flex; gap:12px; margin:0 0 26px;}
    .d2h-btn{flex:1; text-align:center; font-family:inherit; font-weight:700; font-size:14px;
      padding:15px 18px; border-radius:10px; cursor:pointer; border:2px solid var(--navy);
      transition:background .15s ease, color .15s ease;}
    .d2h-btn--solid{background:var(--navy); color:#fff;}
    .d2h-btn--solid:hover{background:#160F38;}
    .d2h-btn--ghost{background:#fff; color:var(--navy);}
    .d2h-btn--ghost:hover{background:var(--beige);}
    .d2h-tabs{display:flex; gap:28px; border-bottom:1px solid var(--line); margin:0 0 20px;}
    .d2h-tab{background:none; border:none; cursor:pointer; font-family:inherit; font-weight:700;
      font-size:15px; color:var(--muted); padding:0 0 12px; position:relative; transition:color .15s;}
    .d2h-tab.is-active{color:var(--navy);}
    .d2h-tab.is-active:after{content:""; position:absolute; left:0; right:0; bottom:-1px;
      height:3px; background:var(--purple); border-radius:3px;}
    .d2h-tabpane{display:none;}
    .d2h-tabpane.is-active{display:block;}
    .d2h-map{width:100%; height:260px; border:0; border-radius:12px; margin:0 0 12px;}
    .d2h-maplink{display:inline-block; margin:0 0 20px; font-size:14px; font-weight:600;
      color:var(--navy,#231B4F); text-decoration:none;}
    .d2h-maplink:hover{color:var(--purple,#7170B4);}
    .d2h-desc h4{font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--purple);
      margin:0 0 10px; font-weight:700;}
    .d2h-desc p{line-height:1.7; color:#3C3858; margin:0 0 14px; font-size:15px;}
    .d2h-feat{list-style:none; padding:0; margin:0; columns:2; column-gap:28px;}
    .d2h-feat li{padding:9px 0 9px 26px; position:relative; font-weight:600; color:#3C3858;
      font-size:14px; break-inside:avoid;}
    .d2h-feat li:before{content:""; position:absolute; left:0; top:13px; width:11px; height:11px;
      border-radius:50%; background:var(--purple);}
    .d2h-mortgage{background:var(--beige); border-radius:12px; padding:22px 24px;}
    .d2h-mortgage p{margin:0 0 8px; color:#3C3858; font-size:15px; line-height:1.6;}
    .d2h-mortgage strong{color:var(--navy);}

    /* ---------- enquiry modal ---------- */
    .d2h-overlay{display:none; position:fixed; inset:0; z-index:9999;
      background:rgba(20,15,45,.55); backdrop-filter:blur(2px);
      align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;}
    .d2h-overlay.is-open{display:flex;}
    .d2h-modal{background:#fff; width:100%; max-width:560px; border-radius:16px;
      box-shadow:0 24px 60px rgba(20,15,45,.4); overflow:hidden;
      font-family:'Montserrat',Arial,sans-serif; animation:d2hPop .18s ease;}
    @keyframes d2hPop{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
    .d2h-modal__head{padding:24px 28px 18px; border-bottom:1px solid var(--line);}
    .d2h-modal__head h3{margin:0; font-size:17px; letter-spacing:.1em; text-transform:uppercase;
      font-weight:800; color:var(--navy);}
    .d2h-modal__sub{margin:6px 0 0; font-size:14px; color:var(--purple); font-weight:600;}
    .d2h-modal__body{padding:24px 28px 8px;}
    .d2h-field{margin:0 0 18px;}
    .d2h-field label{display:block; font-size:14px; font-weight:600; color:var(--navy); margin:0 0 7px;}
    .d2h-field label .req{color:var(--purple);}
    .d2h-input{width:100%; font-family:inherit; font-size:15px; padding:13px 14px;
      border:1px solid var(--line); border-radius:9px; color:var(--ink); background:#fff;}
    .d2h-input:focus{outline:none; border-color:var(--purple); box-shadow:0 0 0 3px rgba(113,112,180,.15);}
    .d2h-input.is-invalid{border-color:#D64545; box-shadow:0 0 0 3px rgba(214,69,69,.12);}
    textarea.d2h-input{resize:vertical; min-height:110px;}
    .d2h-phone{display:flex; gap:10px;}
    .d2h-phone select{flex:none; width:104px; font-family:inherit; font-size:15px; font-weight:600;
      padding:13px 10px; border:1px solid var(--line); border-radius:9px; background:#F7F5F2; color:var(--navy);}
    .d2h-phone select:focus{outline:none; border-color:var(--purple);}
    .d2h-helper{font-size:14px; color:#3C3858; line-height:1.55; margin:0 0 10px;}
    .d2h-modal__foot{padding:18px 28px 24px; border-top:1px solid var(--line);
      display:flex; justify-content:flex-end; gap:14px; align-items:center;}
    .d2h-modal__foot .d2h-err{margin-right:auto; color:#D64545; font-size:13px; font-weight:600; display:none;}
    .d2h-btn--text{flex:none; background:none; border:none; cursor:pointer; font-family:inherit;
      font-weight:700; letter-spacing:.06em; font-size:14px; color:var(--muted); padding:14px 8px;}
    .d2h-btn--text:hover{color:var(--navy);}
    .d2h-btn--submit{flex:none; background:var(--navy); color:#fff; border:none; cursor:pointer;
      font-family:inherit; font-weight:700; letter-spacing:.06em; font-size:14px;
      padding:14px 30px; border-radius:10px;}
    .d2h-btn--submit:hover{background:#160F38;}
    .d2h-btn--submit:disabled{opacity:.6; cursor:default;}
    .d2h-success{padding:40px 28px; text-align:center;}
    .d2h-success svg{width:54px; height:54px; color:#0E7C5A; margin:0 0 14px;}
    .d2h-success h3{margin:0 0 8px; font-size:21px; color:var(--navy); font-weight:800;}
    .d2h-success p{margin:0 0 22px; color:#3C3858; line-height:1.6; font-size:15px;}

    /* ---------- responsive ---------- */
    @media (max-width:880px){
      .d2h-grid{grid-template-columns:1fr; gap:20px;}
      .d2h-detail__top{grid-template-columns:1fr; gap:22px;}
      .d2h-h2{font-size:27px;}
      .d2h-card__media{height:240px;}
      .d2h-feat{columns:1;}
    }
  </style>

  <!-- LIST VIEW -->
  <div class="d2h-list" id="d2hList">
    <p class="d2h-eyebrow">Our Portfolio</p>
    <h2 class="d2h-h2">Properties for Sale in Ghana</h2>
    <div class="d2h-toolbar" id="d2hToolbar">
      <div class="d2h-tbrow">
        <input id="fq" class="d2h-tbinput d2h-tbsearch" type="text" placeholder="Search by title or location&hellip;">
        <div class="d2h-seg" id="d2hDeal">
          <button type="button" class="d2h-segbtn is-active" data-deal="all">All</button>
          <button type="button" class="d2h-segbtn" data-deal="sale">Sale</button>
          <button type="button" class="d2h-segbtn" data-deal="rent">Rent</button>
        </div>
      </div>
      <div class="d2h-tbrow">
        <label class="d2h-tbfield"><span>Min price</span><input id="fmin" class="d2h-tbinput" type="number" min="0" placeholder="No min"></label>
        <label class="d2h-tbfield"><span>Max price</span><input id="fmax" class="d2h-tbinput" type="number" min="0" placeholder="No max"></label>
        <label class="d2h-tbfield"><span>Beds</span>
          <select id="fbeds" class="d2h-tbinput"><option value="0">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select>
        </label>
        <label class="d2h-tbfield"><span>Stage</span>
          <select id="foff" class="d2h-tbinput"><option value="any">Any</option><option value="completed">Completed</option><option value="offplan">Off-plan</option></select>
        </label>
        <button id="fclear" class="d2h-tbclear" type="button">Clear</button>
      </div>
      <div class="d2h-tbcount" id="d2hCount"></div>
    </div>
    <div class="d2h-grid" id="d2hGrid"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="d2h-detail" id="d2hDetail"></div>

  <!-- ENQUIRY MODAL -->
  <div class="d2h-overlay" id="d2hOverlay">
    <div class="d2h-modal" role="dialog" aria-modal="true">
      <div id="d2hModalInner">
        <div class="d2h-modal__head">
          <h3 id="d2hModalTitle">Find Out More</h3>
          <p class="d2h-modal__sub" id="d2hEnqProp"></p>
        </div>
        <div class="d2h-modal__body">
          <div class="d2h-field">
            <label>First Name <span class="req">*</span></label>
            <input class="d2h-input" id="d2hFn" type="text" placeholder="First Name">
          </div>
          <div class="d2h-field">
            <label>Last Name <span class="req">*</span></label>
            <input class="d2h-input" id="d2hLn" type="text" placeholder="Last Name">
          </div>
          <div class="d2h-field">
            <label>Phone Number <span class="req">*</span></label>
            <div class="d2h-phone">
              <select id="d2hDial">
                <option value="+44">+44</option>
                <option value="+233">+233</option>
                <option value="+234">+234</option>
                <option value="+1">+1</option>
                <option value="+27">+27</option>
                <option value="+971">+971</option>
              </select>
              <input class="d2h-input" id="d2hPhone" type="tel" placeholder="7400 123456">
            </div>
          </div>
          <div class="d2h-field">
            <label>Email Address <span class="req">*</span></label>
            <input class="d2h-input" id="d2hEmail" type="email" placeholder="you@example.com">
          </div>
          <div class="d2h-field">
            <p class="d2h-helper" id="d2hHelper">Thanks for your interest in buying a property. Leave a message or instructions and we&rsquo;ll be in touch soon.</p>
            <textarea class="d2h-input" id="d2hComment" placeholder="Add Comment"></textarea>
          </div>
        </div>
        <div class="d2h-modal__foot">
          <span class="d2h-err" id="d2hErr">Please complete the required fields.</span>
          <button class="d2h-btn--text" id="d2hClose">CLOSE</button>
          <button class="d2h-btn--submit" id="d2hSubmit">SUBMIT</button>
        </div>
      </div>
    </div>
  </div>
</div>

  function rowsToListings(rows){

      var cur = trim(r.currency); if(!cur || cur.toUpperCase()==="USD"){ cur = "$"; }
      out.push({
        id: r.id,
        listing_type: (String(r.listing_type||"").toLowerCase().indexOf("seller") > -1) ? "seller" : "vetted",
        title: trim(r.title),
        price: num(r.price),
        currency: cur,
        location: trim(r.location),
        beds: num(r.beds),
        baths: num(r.baths),
        sqm: num(r.sqm),

        deal_type: (String(r.deal_type||"sale").toLowerCase()==="rent") ? "rent" : "sale",

  function submitEnquiry(){
    var fn = document.getElementById("d2hFn");
    var ln = document.getElementById("d2hLn");
    var ph = document.getElementById("d2hPhone");
    var em = document.getElementById("d2hEmail");
    var cm = document.getElementById("d2hComment");

    var badFn = fn.value.replace(/\s/g,"") === "";
    var badLn = ln.value.replace(/\s/g,"") === "";
    var badPh = ph.value.replace(/\s/g,"") === "";
    var badEm = !validEmail(em.value);
    markInvalid(fn, badFn); markInvalid(ln, badLn);
    markInvalid(ph, badPh); markInvalid(em, badEm);

    if(badFn || badLn || badPh || badEm){
      document.getElementById("d2hErr").style.display = "block";
      return;
    }
    document.getElementById("d2hErr").style.display = "none";

    var payload = {
      first_name: fn.value,
      last_name: ln.value,
      phone: document.getElementById("d2hDial").value + " " + ph.value,
      email: em.value,
      message: cm.value,
      property_name: enqProperty ? enqProperty.title : "",
      property_id: enqProperty ? enqProperty.id : "",
      property_location: enqProperty ? enqProperty.location : "",
      enquiry_type: (enqIntent === "tour") ? "tour" : "enquiry",
      source: (enqIntent === "tour") ? "Property listing - Schedule a tour" : "Property listing - Find out more"
    };

    var btn = document.getElementById("d2hSubmit");
    btn.disabled = true; btn.textContent = "Sending\u2026";

    // Demo-safe: skip the live webhook while DEMO_MODE is on
    if(DEMO_MODE || WEBHOOK_URL.indexOf("http") !== 0){
      if(window.console){ console.log("[Diaspora to Home] Enquiry payload (demo, not sent):", payload); }
      showEnquirySuccess();
      return;
    }

    // Live: GHL inbound webhooks don't return CORS headers, so we POST
    // no-cors. We send form-urlencoded (a CORS-safelisted content type)
    // because GHL parses that into named fields most reliably.
    try {
      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: encodeForm(payload)
      }).then(function(){
        showEnquirySuccess();
      })["catch"](function(){
        btn.disabled = false; btn.textContent = "SUBMIT";
        var err = document.getElementById("d2hErr");
        err.textContent = "Something went wrong. Please try again.";
        err.style.display = "block";
      });
    } catch(e){
      btn.disabled = false; btn.textContent = "SUBMIT";
    }
  }

  function encodeForm(obj){
    var parts = [];
    for(var k in obj){
      if(obj.hasOwnProperty(k)){
        parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(obj[k]));
      }
    }
    return parts.join("&");
  }

  }

  // modal wiring (overlay persists; form controls are wired per-open)
  document.getElementById("d2hOverlay").onclick = function(e){
    if(e.target === this){ closeEnquiry(); }
  };

  fetchListings();
})();
</script>

<script>
(function(){
  function postHeight(){
    try{
      var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      if (window.parent && window.parent !== window){
        window.parent.postMessage({ type:"dth-listings-height", height: h }, "*");
      }
    }catch(e){}
  }
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  setInterval(postHeight, 1000);
})();
</script>
